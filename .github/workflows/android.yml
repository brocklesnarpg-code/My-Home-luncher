
name: Build Glassy Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GlassyLauncher-project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q GlassyLauncher-project.zip -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassyLauncher-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          
